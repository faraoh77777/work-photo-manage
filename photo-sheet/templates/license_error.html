<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사진대지생성기 - 라이선스 확인 필요</title>
<style>
body{font-family:'Malgun Gothic',Arial,sans-serif;background:#F0F4F8;color:#1A2332;
  display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;}
.card{background:#fff;border-radius:14px;padding:32px;max-width:480px;box-shadow:0 4px 16px rgba(0,0,0,0.08);}
h1{font-size:20px;margin:0 0 12px;}
p{font-size:15px;line-height:1.6;color:#5A7A9A;margin:0 0 8px;}
.err{background:#FDEDEC;color:#C0392B;border:1px solid #F5B7B1;border-radius:8px;padding:12px 14px;
  font-size:14px;margin-top:16px;}
</style>
</head>
<body>
<div class="card">
  <h1>🔒 라이선스 확인이 필요합니다</h1>
  <p>이 프로그램을 쓰려면 유효한 라이선스 키가 필요합니다.</p>
  <p>발급받은 <b>license.key</b> 파일을 이 프로그램(.exe)과 같은 폴더에 넣고 다시 실행해 주세요.</p>
  <div class="err">{{ error }}</div>
</div>
</body>
</html>
